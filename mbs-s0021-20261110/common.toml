# mbs-0021 test configuration with per-wafer SAT beams.
# The instrument model has only the 28 SAT f090 and f150 rows, so this runs the
# SAT beams only. Merge with the other bands and the LAT for the release model.
lmax_over_nside = 2.5
healpix = true
car = false
output_folder = "output/{tag}"
output_filename_template = "sobs_mbs-s0021-20261110_{telescope}_mission_{band}_{tag}_{pixelization}.fits"
unit = "uK_CMB"
num = 0
output_reference_frame = "C"
instrument_parameters = "instrument_model/instrument_model_sat_beams.tbl"
